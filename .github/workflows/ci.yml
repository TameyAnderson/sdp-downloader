name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    name: Тести та перевірки
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Залежності
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.12.16
          uv sync --locked

      - name: Перевірка Python та lock-файлу
        run: |
          uv run --locked ruff check bot.py tests
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock
          git diff --exit-code -- requirements.lock

      - name: Компіляція Python
        run: python -m compileall -q bot.py tests

      - name: Тести
        run: |
          uv run --locked coverage run -m pytest -q
          uv run --locked coverage report

      - name: Відомі вразливості Python-залежностей
        run: uv run --locked pip-audit -r requirements.lock --no-deps --disable-pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Збірка Material Web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Контракт API
        run: |
          uv run --locked python scripts/export_openapi.py
          npm run api:types
          git diff --exit-code -- frontend/openapi.json frontend/api-types.d.ts

      - name: Браузерні перевірки
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Синтаксис JS у Mini App
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          js = re.search(r"<script>(.*)</script>", html, re.S)
          assert js, "не знайшов <script> в index.html"
          pathlib.Path("/tmp/app.js").write_text(js.group(1), encoding="utf-8")
          PY
          node --check /tmp/app.js

      - name: Збірка образу
        run: docker build -t sdp-downloader:ci .

      - name: Обидва стеки валідні
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.lite.yml config --quiet
        env:
          BOT_TOKEN: dummy

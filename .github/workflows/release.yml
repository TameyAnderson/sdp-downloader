name: Publish image

# Builds and publishes the container image to GitHub Container Registry.
# Збирає й публікує образ у GitHub Container Registry.
#
#   push to main  -> ghcr.io/<owner>/sdp-downloader:edge
#   tag v1.0      -> :v1.0, :1.0, :1, :latest  + a GitHub release
#
# Nothing to configure: GITHUB_TOKEN is provided by Actions itself.
# Налаштовувати нічого не треба: GITHUB_TOKEN Actions видає сам.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Weekly canary. It rebuilds :edge and, more to the point, runs the smoke
  # test against a fresh base image and a fresh Deno — so a break shows up here
  # on a Monday instead of on somebody's server after a restart.
  # Note what this does NOT do: requirements.txt pins yt-dlp, so the rebuild
  # installs the same version. Freshness comes from the container's own upgrade
  # at startup (AUTO_UPGRADE_YTDLP + YTDLP_CHANNEL), not from this schedule.
  # Щотижнева канарка. Перезбирає :edge і, головне, ганяє smoke-тест на свіжому
  # базовому образі та свіжому Deno — щоб поломка спливла тут у понеділок, а не
  # на чиємусь сервері після перезапуску.
  # Чого це НЕ робить: requirements.txt фіксує версію yt-dlp, тож перезбірка
  # ставить ту саму. Свіжість дає самооновлення контейнера при старті
  # (AUTO_UPGRADE_YTDLP + YTDLP_CHANNEL), а не цей розклад.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write        # для створення релізу на тег / to create the release
      packages: write        # для публікації образу / to publish the image

    steps:
      - uses: actions/checkout@v4

      # arm64 теж збираємо: Raspberry Pi та ARM-VPS — типовий дім для self-hosted.
      # arm64 too: Raspberry Pi and ARM VPS are a common self-hosted home.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Docker accepts lowercase image names only, and a GitHub login may well
      # contain capitals — so the name is lowercased here rather than assumed.
      # Docker приймає назви образів лише в нижньому регістрі, а логін на GitHub
      # цілком може мати великі літери — тому назва зводиться до нижнього тут.
      - name: Work out the image name
        id: img
        run: |
          echo "name=$(echo '${{ github.repository_owner }}/sdp-downloader' \
            | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            # A two-part tag like v1.1 is NOT valid semver — semver wants three
            # parts — and the patterns below then quietly yield nothing, after
            # which buildx dies with "tag is needed when pushing to registry".
            # This first line is the safety net: the git tag is taken verbatim,
            # whatever shape it has, so the tag list is never empty.
            # Дволанковий тег на кшталт v1.1 — НЕ валідний semver (потрібні три
            # частини), і шаблони нижче тихо не дають нічого, після чого buildx
            # падає з "tag is needed when pushing to registry". Цей перший рядок
            # і є страховкою: тег береться як є, тож список ніколи не порожній.
            type=ref,event=tag
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=s.d.p downloader
            org.opencontainers.image.description=Self-hosted Telegram bot for downloading video and audio
            org.opencontainers.image.licenses=MIT

      # buildx reports an empty tag list as "tag is needed when pushing to
      # registry", which says nothing about the cause. Fail here instead, while
      # it is still obvious what went wrong.
      # buildx повідомляє про порожній список тегів як "tag is needed when
      # pushing to registry" — про причину ні слова. Падаємо тут, поки ще
      # видно, що саме сталося.
      - name: Make sure there is something to tag
        run: |
          if [ -z "${{ steps.meta.outputs.tags }}" ]; then
            echo "::error::No image tags were produced for ${{ github.ref }}."
            echo "::error::A version tag must look like v1.2.3 — three parts."
            exit 1
          fi
          echo "${{ steps.meta.outputs.tags }}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кеш шарів у самому реєстрі: наступні збірки — хвилини замість десятків.
          # Layer cache in the registry itself: later builds take minutes, not tens.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Testing $IMAGE"
          # Образ має мати всі інструменти й запускати bot.py без падіння.
          # The image must carry every tool and import bot.py without blowing up.
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            ffmpeg -version  > /dev/null
            ffprobe -version > /dev/null
            deno --version   > /dev/null
            yt-dlp --version
            # Без curl_cffi список цілей імперсонації порожній, і TikTok
            # відповідає 403 Forbidden навіть на запит із дійсними cookies.
            # Without curl_cffi the impersonate target list is empty and TikTok
            # answers 403 Forbidden even to a request carrying valid cookies.
            yt-dlp --list-impersonate-targets | grep -qi chrome
            python -c "import aiogram, aiohttp; print(\"aiogram\", aiogram.__version__)"
            BOT_TOKEN=1:test python -c "
          import importlib.util, os
          os.environ.setdefault(\"STATS_DB\", \"/tmp/t.db\")
          spec = importlib.util.spec_from_file_location(\"bot\", \"/app/bot.py\")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          print(\"services:\", len(m.SERVICES), \"| i18n keys:\", len(m.T[\"uk\"]))
          "'

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.lite.yml
            curl -o .env https://raw.githubusercontent.com/${{ github.repository }}/main/.env.lite.example
            # put your BOT_TOKEN into .env
            docker compose -f docker-compose.lite.yml up -d
            ```

            Full edition (Mini App panel, 2 GB files): use `docker-compose.yml`
            and `.env.example` instead.

            Image: `ghcr.io/${{ steps.img.outputs.name }}:${{ github.ref_name }}`
            (linux/amd64, linux/arm64)
